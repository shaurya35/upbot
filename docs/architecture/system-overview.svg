<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title description">
<title id="title">Upbot system overview</title>
<desc id="description">The dashboard uses the API, which reads and writes PostgreSQL. The pusher loads active websites and maintains the Redis schedule and stream. A worker consumes jobs, calls a Cloudflare Worker, and stores check results in PostgreSQL.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
  .section { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
  .name { font-size: 21px; font-weight: 650; fill: #0f172a; }
  .path { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #475569; }
  .detail { font-size: 14px; fill: #475569; }
  .label { font-size: 13px; fill: #475569; }
  .line { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
  .both { marker-start: url(#arrow); }
</style>
<rect width="1200" height="740" fill="#fff"/>
<text class="title" x="48" y="48">Upbot / System overview</text>
<text class="detail" x="48" y="74">Application services and the scheduled check pipeline</text>
<text class="section" x="48" y="110">APPLICATION</text>
<text class="section" x="48" y="334">MONITORING PIPELINE</text>
<rect x="48" y="130" width="264" height="126" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text class="name" x="68" y="163">Dashboard</text><text class="path" x="68" y="187">apps/client</text><text class="detail" x="68" y="214">Account and profile API calls</text><text class="detail" x="68" y="234">Sample monitoring screens</text><rect x="468" y="130" width="264" height="126" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text class="name" x="488" y="163">API</text><text class="path" x="488" y="187">apps/server</text><text class="detail" x="488" y="214">Authentication and profiles</text><text class="detail" x="488" y="234">Website management</text><rect x="888" y="130" width="264" height="126" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text class="name" x="908" y="163">PostgreSQL</text><text class="path" x="908" y="187">packages/store</text><text class="detail" x="908" y="214">Users, websites, and regions</text><text class="detail" x="908" y="234">Check history</text><rect x="48" y="360" width="264" height="126" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text class="name" x="68" y="393">Pusher</text><text class="path" x="68" y="417">apps/pusher</text><text class="detail" x="68" y="444">Reads due websites</text><text class="detail" x="68" y="464">Schedules and publishes jobs</text><rect x="468" y="360" width="264" height="126" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text class="name" x="488" y="393">Redis</text><text class="path" x="488" y="417">packages/redis-streams</text><text class="detail" x="488" y="444">Sorted set: upbot:schedule</text><text class="detail" x="488" y="464">Stream: upbot:websites</text><rect x="888" y="360" width="264" height="126" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text class="name" x="908" y="393">Worker</text><text class="path" x="908" y="417">apps/worker</text><text class="detail" x="908" y="444">Consumer group: monitoring</text><text class="detail" x="908" y="464">Collects and writes results</text><rect x="888" y="570" width="264" height="126" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text class="name" x="908" y="603">Cloudflare Worker</text><text class="path" x="908" y="627">apps/cfworkers</text><text class="detail" x="908" y="654">Validates each job</text><text class="detail" x="908" y="674">Checks requested region entries</text><rect x="468" y="570" width="264" height="126" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text class="name" x="488" y="603">Target websites</text><text class="path" x="488" y="627">HTTP endpoints</text><text class="detail" x="488" y="654">HEAD requests</text><text class="detail" x="488" y="674">Status, latency, and errors</text>
<path class="line both" d="M 318 193 H 462"/>
<text class="label" x="390" y="181" text-anchor="middle">HTTP</text>
<path class="line both" d="M 738 193 H 882"/>
<text class="label" x="810" y="181" text-anchor="middle">Prisma</text>
<path class="line" d="M 954 262 V 292 H 280 V 354"/>
<rect x="422" y="280" width="220" height="24" fill="#fff"/>
<text class="label" x="532" y="297" text-anchor="middle">Load active websites and plans</text>
<path class="line" d="M 1098 354 V 262"/>
<rect x="1038" y="280" width="112" height="24" fill="#fff"/>
<text class="label" x="1094" y="297" text-anchor="middle">Write checks</text>
<path class="line both" d="M 318 423 H 462"/>
<text class="label" x="390" y="405" text-anchor="middle">Schedule</text>
<text class="label" x="390" y="445" text-anchor="middle">and enqueue</text>
<path class="line" d="M 738 402 H 882"/>
<text class="label" x="810" y="390" text-anchor="middle">Deliver jobs</text>
<path class="line" d="M 882 446 H 738"/>
<text class="label" x="810" y="470" text-anchor="middle">Acknowledge</text>
<path class="line both" d="M 1020 492 V 564"/>
<rect x="1030" y="513" width="130" height="38" fill="#fff"/>
<text class="label" x="1040" y="528">POST jobs</text>
<text class="label" x="1040" y="547">Return results</text>
<path class="line both" d="M 882 633 H 738"/>
<text class="label" x="810" y="620" text-anchor="middle">HEAD</text>
<text class="label" x="48" y="636">Each job contains one website</text>
<text class="label" x="48" y="657">and a list of requested regions.</text>
<text class="detail" x="48" y="724">Region labels do not prove execution location. Read the architecture notes for current delivery limits.</text>
</svg>